version: "3.8"

services:
  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - output_data:/app/outputs
    restart: unless-stopped

  # Background Runner (single instance, FIFO queue)
  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - output_data:/app/outputs
      - ./templates:/app/templates:ro
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aidocs
      POSTGRES_USER: aidocs
      POSTGRES_PASSWORD: aidocs_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg_data:
  output_data:
