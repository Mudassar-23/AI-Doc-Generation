version: "3.8"

services:
  # ── PostgreSQL 16 Database ─────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: aidocs_db
    environment:
      POSTGRES_DB: aidocs
      POSTGRES_USER: aidocs
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidocs -d aidocs"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── FastAPI Backend API ───────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aidocs_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://aidocs:password@db:5432/aidocs
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - output_data:/app/outputs
      - tmp_data:/app/tmp
    restart: unless-stopped

  # ── Background Runner Worker Daemon ───────────────────────────
  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    container_name: aidocs_runner
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://aidocs:password@db:5432/aidocs
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - output_data:/app/outputs
      - tmp_data:/app/tmp
      - ./templates:/app/templates:ro
    restart: unless-stopped

  # ── Nginx Web Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aidocs_frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  output_data:
  tmp_data:
