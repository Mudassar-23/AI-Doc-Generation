# Nginx Production SSL Reverse Proxy Configuration Template for AI Documentation Platform

server {
    listen 80;
    server_name localhost yourdomain.com;
    return 301 https://$host$request_uri; # Redirect HTTP to HTTPS
}

server {
    listen 443 ssl http2;
    server_name localhost yourdomain.com;

    # SSL Certificates
    ssl_certificate /etc/ssl/certs/aidocs.crt;
    ssl_certificate_key /etc/ssl/private/aidocs.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Client upload limit
    client_max_body_size 10M;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API Backend
    location / {
        proxy_pass http://api:8000;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}
